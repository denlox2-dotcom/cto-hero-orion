name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:production
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chromium
      - run: npx playwright test --config=playwright.home.config.ts --grep "keeps title"
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chromium
          HOME_TEST_MODE: production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: |
            test-results/production/artifacts/
            test-results/home/production/artifacts/
          retention-days: 7
